mpc:
  mpc_name:              "LinearMPC"
  model:                 "Kinematic Augmented Frenet Gaussian" # Kinematic Augmented Frenet Gaussian
  discrete_method:       "Euler" # Euler CrankNicolson RK4
  solver:                "osqp" # osqp qpoases
  mpcWindow:             40
  mpc_dt:                0.05
  control_dt:            0.05 # duplicated with sim as I do not want to change the code yet
          
  Q:                     [100, 10, 100, 1, 0, 0, 0, 0, 0, 0, 0, 0]
  Q_final:               [200, 20, 200, 2, 0, 0, 0, 0, 0, 0, 0, 0]
  R:                     [0.2, 0.2]
          
  max_input:             [1.5, 1.5]
  max_delta_input:       [5, 5]
  add_delta_constraints: true
    
  linear_method:         1
     
  print_time:            false
  propagete_cov:         true
  linearized:            true
  variance_aware:        false
  aware_len:             40
  lambda_var:            [1, 1]
     
  record_data:           true
  record_data_path:      "log/gpr_log/linear_mpc_frenet.txt"
 
